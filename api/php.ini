; PHP settings appended to the runtime php.ini by vercel-php.

; Expose real environment variables in $_ENV (Vercel injects them there).
variables_order = "EGPCS"

; The filesystem is read-only except /tmp.
session.save_path = "/tmp"
session.gc_maxlifetime = 3600

display_errors = Off
log_errors = On
upload_max_filesize = 4M
post_max_size = 4M
